/* Firebase setup                                                         */
/* ---------------------------------------------------------------------- */

const firebaseConfig = window.__FIREBASE_CONFIG__;
const CONFIG_IS_PLACEHOLDER = !firebaseConfig || firebaseConfig.apiKey === "YOUR_API_KEY";

let db = null;
if (!CONFIG_IS_PLACEHOLDER) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}

function watchKey(key, fallback, cb) {
  if (!db) return () => {};
  return db.collection("tms_data").doc(key).onSnapshot(
    (snap) => cb(snap.exists ? (snap.data().value ?? fallback) : fallback),
    (err) => { console.error("watch failed", key, err); cb(fallback); }
  );
}

async function saveKey(key, value) {
  if (!db) return false;
  try {
    await db.collection("tms_data").doc(key).set({ value, updatedAt: Date.now() });
    return true;
  } catch (e) {
    console.error("save failed", key, e);
    return false;
  }
}

function makeId(prefix) { return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`; }
function curriculumMeta(name) { return ALL_CURRICULUMS.find((t) => t.name === name) || OTHER_CURRICULUM; }
function levelMeta(name) { return ALL_LEVELS.find((t) => t.name === name) || OTHER_LEVEL; }
function statusMeta(name) { return STATUS_OPTIONS.find((s) => s.name === name) || STATUS_OPTIONS[0]; }

function fmtDate(d) {
  if (!d) return "\u2014";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
function monthKey(d) { return d ? d.slice(0, 7) : null; }

function csvEscape(v) {
  const s = String(v ?? "");
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}
function downloadCsv(filename, rows) {
  const csv = rows.map((row) => row.map(csvEscape).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCsv(text) {
  const rows = []; let row = []; let field = ""; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((f) => f.trim() !== ""));
}
function normalizeHeader(h) { return h.trim().toLowerCase().replace(/[^a-z0-9]/g, ""); }
function guessColumn(headers, candidates) {
  const norm = headers.map(normalizeHeader);
  for (const cand of candidates) { const idx = norm.indexOf(cand); if (idx !== -1) return idx; }
  for (let i = 0; i < norm.length; i++) if (candidates.some((c) => norm[i].includes(c))) return i;
  return -1;
}

  return (
    <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 p-1.5" style={{ background: "white" }}>
      <img src={`data:image/png;base64,${LOGO_B64}`} alt="Grassroot Soccer" className="w-full h-full object-contain" />
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Chart.js wrapper                                                       */
/* ---------------------------------------------------------------------- */

function ChartBox({ type, data, options, height = 240 }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const key = JSON.stringify({ data, options, type });
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, { type, data, options: { responsive: true, maintainAspectRatio: false, ...options } });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [key]);
  return <div style={{ position: "relative", height }}><canvas ref={canvasRef}></canvas></div>;
}

const AXIS_COLOR = "#5C6B65";
const GRID_COLOR = "#E3E7E4";

/* App                                                                     */
/* ---------------------------------------------------------------------- */

function App() {
  const [tab, setTab] = useState("dashboard");
  const [loadedKeys, setLoadedKeys] = useState({});
  const [saveError, setSaveError] = useState(null);

  const [trainings, setTrainings] = useState([]);
  const [trainers, setTrainers] = useState([]);
  const [participants, setParticipants] = useState([]);
  const [countries, setCountries] = useState(DEFAULT_COUNTRIES);

  useEffect(() => {
    if (CONFIG_IS_PLACEHOLDER) return;
    const unsub1 = watchKey("trainings", [], (v) => {
      const migrated = (v || []).map((t) => ({
        curriculum: t.curriculum || t.type || "", trainingType: t.trainingType || "",
        reportSummary: t.reportSummary || "", reportLink: t.reportLink || "", ...t,
      }));
      setTrainings(migrated);
      setLoadedKeys((k) => ({ ...k, trainings: true }));
    });
    const unsub2 = watchKey("trainers", [], (v) => { setTrainers(v || []); setLoadedKeys((k) => ({ ...k, trainers: true })); });
    const unsub3 = watchKey("participants", [], (v) => { setParticipants(v || []); setLoadedKeys((k) => ({ ...k, participants: true })); });
    const unsub4 = watchKey("countries", null, (v) => {
      setCountries(v && v.length ? v : DEFAULT_COUNTRIES);
      setLoadedKeys((k) => ({ ...k, countries: true }));
    });
    return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
  }, []);

  const loading = !CONFIG_IS_PLACEHOLDER && !(loadedKeys.trainings && loadedKeys.trainers && loadedKeys.participants && loadedKeys.countries);

  const persist = useCallback(async (key, value) => {
    const ok = await saveKey(key, value);
    if (!ok) { setSaveError("Could not save your last change. Check your connection and try again."); setTimeout(() => setSaveError(null), 4000); }
  }, []);

  const updateTrainings = useCallback((next) => { setTrainings(next); persist("trainings", next); }, [persist]);
  const updateTrainers = useCallback((next) => { setTrainers(next); persist("trainers", next); }, [persist]);
  const updateParticipants = useCallback((next) => { setParticipants(next); persist("participants", next); }, [persist]);
  const updateCountries = useCallback((next) => { setCountries(next); persist("countries", next); }, [persist]);

  const ensureCountry = useCallback((name) => {
    if (!name) return;
    if (!countries.includes(name)) updateCountries([...countries, name].sort());
  }, [countries, updateCountries]);

  const trainerById = useMemo(() => { const m = {}; trainers.forEach((t) => (m[t.id] = t)); return m; }, [trainers]);
  const participantById = useMemo(() => { const m = {}; participants.forEach((p) => (m[p.id] = p)); return m; }, [participants]);

  const NAV = [
    { id: "dashboard", label: "Dashboard", icon: "layout-dashboard" },
    { id: "trainings", label: "Trainings", icon: "calendar" },
    { id: "reports", label: "Reports", icon: "file-text" },
    { id: "trainers", label: "Trainers", icon: "user-cog" },
    { id: "participants", label: "Participants", icon: "users" },
  ];

  if (CONFIG_IS_PLACEHOLDER) return <SetupNeeded />;

  if (loading) {
    return (
      <div className="w-full flex items-center justify-center py-24" style={{ background: BRAND.bg, minHeight: "100vh" }}>
        <Icon name="loader-2" size={28} className="tms-spin" style={{ color: BRAND.tealDark }} />
      </div>
    );
  }

  return (
    <div className="w-full min-h-screen" style={{ background: BRAND.bg, fontFamily: "system-ui, -apple-system, sans-serif" }}>
      <div style={{ background: BRAND.pitch }}>
        <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-5 pb-0">
          <div className="flex items-center gap-3 pb-4">
            <Logo />
            <div>
              <h1 className="text-white text-base sm:text-lg font-semibold leading-tight">GRS Training Management System</h1>
              <p className="text-xs" style={{ color: "#8FB3A8" }}>Trainings across countries, trainers &amp; participants</p>
            </div>
          </div>
          <div className="flex gap-1 overflow-x-auto pb-0 -mb-px">
            {NAV.map((n) => {
              const active = tab === n.id;
              return (
                <button key={n.id} onClick={() => setTab(n.id)}
                  className="flex items-center gap-1.5 px-3.5 py-2.5 text-sm font-medium whitespace-nowrap border-b-2 transition-colors"
                  style={{ color: active ? "white" : "#8FB3A8", borderColor: active ? BRAND.teal : "transparent" }}>
                  <Icon name={n.icon} size={17} />{n.label}
                </button>
              );
            })}
          </div>
        </div>
        <div style={{ height: 3, background: `linear-gradient(90deg, ${BRAND.teal}, ${BRAND.amber})` }} />
      </div>

      {saveError && (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-3">
          <div className="rounded-lg px-3 py-2 text-sm flex items-center gap-2" style={{ background: "#FBEAF0", color: "#72243E" }}>
            <Icon name="alert-triangle" size={15} /> {saveError}
          </div>
        </div>
      )}

      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6">
        {tab === "dashboard" && <Dashboard trainings={trainings} trainers={trainers} participants={participants} countries={countries} />}
        {tab === "trainings" && (
          <TrainingsView trainings={trainings} updateTrainings={updateTrainings} trainers={trainers} participants={participants}
            countries={countries} ensureCountry={ensureCountry} trainerById={trainerById} participantById={participantById} />
        )}
        {tab === "reports" && <ReportsView trainings={trainings} updateTrainings={updateTrainings} countries={countries} trainerById={trainerById} />}
        {tab === "trainers" && <TrainersView trainers={trainers} updateTrainers={updateTrainers} trainings={trainings} countries={countries} ensureCountry={ensureCountry} />}
        {tab === "participants" && <ParticipantsView participants={participants} updateParticipants={updateParticipants} trainings={trainings} countries={countries} ensureCountry={ensureCountry} />}
      </div>
      <p className="text-center text-xs pb-6" style={{ color: BRAND.sub }}>Data is stored in your Firebase project and shared with everyone who has this link.</p>
    </div>
  );
}

function SetupNeeded() {
  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{ background: BRAND.bg }}>
      <div className="max-w-lg w-full rounded-2xl p-6" style={{ background: BRAND.card, border: `1px solid ${BRAND.border}` }}>
        <div className="w-11 h-11 rounded-xl flex items-center justify-center mb-4" style={{ background: "#FAEEDA", color: "#854F0B" }}>
          <Icon name="settings" size={22} />

        <h1 className="text-lg font-semibold mb-2" style={{ color: BRAND.ink }}>One setup step left</h1>
        <p className="text-sm mb-3" style={{ color: BRAND.sub }}>
          This app needs a Firebase project to store its data. Open <code>index.html</code> in a text editor,
          find the <code>window.__FIREBASE_CONFIG__</code> block near the top, and paste in your project's config values.

}

function CountrySelect({ value, onChange, countries, ensureCountry }) {
  const [adding, setAdding] = useState(false);
  const [newVal, setNewVal] = useState("");
  if (adding) {
    return (
      <div className="flex gap-2">
        <input autoFocus className={inputCls} style={inputStyle} placeholder="Country name" value={newVal} onChange={(e) => setNewVal(e.target.value)} />
        <button type="button" className="rounded-lg px-3 text-sm font-medium text-white shrink-0" style={{ background: BRAND.tealDark }}
          onClick={() => { const v = newVal.trim(); if (v) { ensureCountry(v); onChange(v); } setAdding(false); setNewVal(""); }}>
          Add
        </button>
      </div>
    );
  }
  return (
    <select className={inputCls} style={inputStyle} value={value} onChange={(e) => { if (e.target.value === "__add__") setAdding(true); else onChange(e.target.value); }}>
      <option value="">Select country\u2026</option>
      {countries.map((c) => <option key={c} value={c}>{c}</option>)}
      <option value="__add__">+ Add new country\u2026</option>
    </select>
  );
}

function Dashboard({ trainings, trainers, participants, countries }) {
  const [fCountry, setFCountry] = useState("All");
  const [fCurriculum, setFCurriculum] = useState("All");

  const filtered = useMemo(() =>
    trainings.filter((t) => (fCountry === "All" || t.country === fCountry) && (fCurriculum === "All" || t.curriculum === fCurriculum)),
    [trainings, fCountry, fCurriculum]
  );

  const totalParticipantSlots = useMemo(() => filtered.reduce((sum, t) => sum + (t.participantIds?.length || 0), 0), [filtered]);
  const activeCountries = useMemo(() => new Set(filtered.map((t) => t.country)).size, [filtered]);
  const activeTrainers = useMemo(() => new Set(filtered.map((t) => t.trainerId).filter(Boolean)).size, [filtered]);

  const byCountry = useMemo(() => {
    const m = {}; filtered.forEach((t) => { m[t.country] = (m[t.country] || 0) + 1; });
    return Object.entries(m).map(([country, count]) => ({ country, count })).sort((a, b) => b.count - a.count);
  }, [filtered]);

  const byCurriculum = useMemo(() => {
    const m = {}; filtered.forEach((t) => { m[t.curriculum] = (m[t.curriculum] || 0) + 1; });
    return Object.entries(m).filter(([k]) => k).map(([name, value]) => ({ name, value, color: curriculumMeta(name).color }));
  }, [filtered]);

  const byLevel = useMemo(() => {
    const m = {}; filtered.forEach((t) => { m[t.trainingType] = (m[t.trainingType] || 0) + 1; });
    return Object.entries(m).filter(([k]) => k).map(([name, count]) => ({ name, count, color: levelMeta(name).color }));
  }, [filtered]);

  const byMonth = useMemo(() => {
    const m = {}; filtered.forEach((t) => { const k = monthKey(t.startDate); if (!k) return; m[k] = (m[k] || 0) + 1; });
    const keys = Object.keys(m).sort().slice(-12);
    return keys.map((k) => ({ month: new Date(k + "-01").toLocaleDateString(undefined, { month: "short", year: "2-digit" }), count: m[k] }));
  }, [filtered]);

  const upcoming = useMemo(() => {
    const today = new Date().toISOString().slice(0, 10);
    return filtered.filter((t) => t.startDate >= today && t.status !== "Cancelled").sort((a, b) => a.startDate.localeCompare(b.startDate)).slice(0, 6);
  }, [filtered]);

  const exportReport = () => {
    const rows = [["Title", "Training type", "Curriculum", "Country", "Venue", "Start date", "End date", "Trainer", "Participants", "Status", "Report link"]];
    filtered.forEach((t) => rows.push([t.title, t.trainingType, t.curriculum, t.country, t.venue || "", t.startDate, t.endDate || "", t.trainerName || "", (t.participantIds || []).length, t.status, t.reportLink || ""]));
    downloadCsv("training-report.csv", rows);
  };

  return (
    <div>
      <div className="flex flex-wrap items-end justify-between gap-3 mb-5">
        <div className="flex flex-wrap gap-2">
          <select className={`${inputCls} w-auto`} style={inputStyle} value={fCountry} onChange={(e) => setFCountry(e.target.value)}>
            <option value="All">All countries</option>{countries.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
          <select className={`${inputCls} w-auto`} style={inputStyle} value={fCurriculum} onChange={(e) => setFCurriculum(e.target.value)}>
            <option value="All">All curriculums</option>{ALL_CURRICULUMS.map((t) => <option key={t.name} value={t.name}>{t.name}</option>)}
          </select>
        </div>
        <SecondaryButton onClick={exportReport}><Icon name="download" size={15} /> Export report (CSV)</SecondaryButton>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        <StatCard label="Trainings" value={filtered.length} iconName="calendar" accent={BRAND.tealDark} />
        <StatCard label="Participants (slots)" value={totalParticipantSlots} iconName="users" accent="#534AB7" />
        <StatCard label="Countries active" value={activeCountries} iconName="world" accent="#185FA5" />
        <StatCard label="Trainers active" value={activeTrainers} iconName="user-cog" accent="#854F0B" />
      </div>

      {filtered.length === 0 ? (
        <EmptyState iconName="calendar" title="No trainings yet" subtitle="Add a training to see it reflected in the dashboard." />
      ) : (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
          <div className="rounded-xl p-4" style={{ background: BRAND.card, border: `1px solid ${BRAND.border}` }}>
            <p className="text-sm font-medium mb-3" style={{ color: BRAND.ink }}>Trainings by country</p>
            <ChartBox type="bar" height={240}
              data={{ labels: byCountry.map((d) => d.country), datasets: [{ data: byCountry.map((d) => d.count), backgroundColor: BRAND.tealDark, borderRadius: 4, maxBarThickness: 18 }] }}
              options={{ indexAxis: "y", plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0, color: AXIS_COLOR, font: { size: 11 } }, grid: { color: GRID_COLOR } }, y: { ticks: { color: AXIS_COLOR, font: { size: 11 } }, grid: { display: false } } } }}
            />
          </div>

          <div className="rounded-xl p-4" style={{ background: BRAND.card, border: `1px solid ${BRAND.border}` }}>
            <p className="text-sm font-medium mb-3" style={{ color: BRAND.ink }}>Trainings by curriculum</p>
            <ChartBox type="doughnut" height={240}
              data={{ labels: byCurriculum.map((d) => d.name), datasets: [{ data: byCurriculum.map((d) => d.value), backgroundColor: byCurriculum.map((d) => d.color), borderColor: "#fff", borderWidth: 2 }] }}
              options={{ plugins: { legend: { position: "bottom", labels: { color: AXIS_COLOR, font: { size: 11 }, boxWidth: 10, boxHeight: 10 } } } }}
            />
          </div>

          <div className="rounded-xl p-4" style={{ background: BRAND.card, border: `1px solid ${BRAND.border}` }}>
            <p className="text-sm font-medium mb-3" style={{ color: BRAND.ink }}>Trainings by type</p>
            <ChartBox type="bar" height={220}
              data={{ labels: byLevel.map((d) => d.name), datasets: [{ data: byLevel.map((d) => d.count), backgroundColor: byLevel.map((d) => d.color), borderRadius: 4, maxBarThickness: 40 }] }}
              options={{ plugins: { legend: { display: false } }, scales: { x: { ticks: { color: AXIS_COLOR, font: { size: 10 } }, grid: { display: false } }, y: { beginAtZero: true, ticks: { precision: 0, color: AXIS_COLOR, font: { size: 11 } }, grid: { color: GRID_COLOR } } } }}
            />
          </div>

          <div className="rounded-xl p-4" style={{ background: BRAND.card, border: `1px solid ${BRAND.border}` }}>
            <p className="text-sm font-medium mb-3" style={{ color: BRAND.ink }}>Trainings per month</p>
            <ChartBox type="line" height={220}
              data={{ labels: byMonth.map((d) => d.month), datasets: [{ data: byMonth.map((d) => d.count), borderColor: BRAND.amber, backgroundColor: BRAND.amber, tension: 0.35, pointRadius: 3 }] }}
              options={{ plugins: { legend: { display: false } }, scales: { x: { ticks: { color: AXIS_COLOR, font: { size: 11 } }, grid: { display: false } }, y: { beginAtZero: true, ticks: { precision: 0, color: AXIS_COLOR, font: { size: 11 } }, grid: { color: GRID_COLOR } } } }}
            />
          </div>
        </div>
      )}

      <div className="rounded-xl p-4" style={{ background: BRAND.card, border: `1px solid ${BRAND.border}` }}>
        <p className="text-sm font-medium mb-3" style={{ color: BRAND.ink }}>Upcoming trainings</p>
        {upcoming.length === 0 ? (
          <p className="text-sm" style={{ color: BRAND.sub }}>Nothing scheduled ahead right now.</p>
        ) : (
          <div className="flex flex-col gap-2">
            {upcoming.map((t) => {
              const cm = curriculumMeta(t.curriculum);
              return (
                <div key={t.id} className="flex items-center justify-between gap-3 py-2" style={{ borderBottom: `1px solid ${BRAND.border}` }}>
                  <div className="min-w-0">
                    <p className="text-sm font-medium truncate" style={{ color: BRAND.ink }}>{t.title}</p>
                    <p className="text-xs flex items-center gap-1 mt-0.5" style={{ color: BRAND.sub }}>
                      <Icon name="map-pin" size={12} /> {t.country} &middot; <Icon name="clock" size={12} /> {fmtDate(t.startDate)}
                    </p>
                  </div>
                  <Badge label={t.curriculum} color={cm.color} soft={cm.soft} />
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function emptyTraining() {
  return { id: null, title: "", trainingType: TRAINING_LEVELS[0].name, curriculum: CURRICULUMS[0].name, country: "", venue: "",
    startDate: "", endDate: "", trainerId: "", participantIds: [], status: "Planned", notes: "", reportSummary: "", reportLink: "" };
}

function TrainingsView({ trainings, updateTrainings, trainers, participants, countries, ensureCountry, trainerById, participantById }) {
  const [query, setQuery] = useState("");
  const [fCountry, setFCountry] = useState("All");
  const [fCurriculum, setFCurriculum] = useState("All");
  const [modalData, setModalData] = useState(null);
  const [viewing, setViewing] = useState(null);
  const [deleting, setDeleting] = useState(null);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return trainings.filter((t) => fCountry === "All" || t.country === fCountry)
      .filter((t) => fCurriculum === "All" || t.curriculum === fCurriculum)
      .filter((t) => !q || t.title.toLowerCase().includes(q) || (t.venue || "").toLowerCase().includes(q))
      .sort((a, b) => (b.startDate || "").localeCompare(a.startDate || ""));
  }, [trainings, query, fCountry, fCurriculum]);

  const openNew = () => setModalData(emptyTraining());
  const openEdit = (t) => setModalData({ ...t });

  const save = (form) => {
    if (!form.title.trim() || !form.country || !form.startDate) return;
    const trainer = trainers.find((tr) => tr.id === form.trainerId);
    const record = { ...form, trainerName: trainer ? trainer.name : "" };
    if (record.id) updateTrainings(trainings.map((t) => (t.id === record.id ? record : t)));
    else { record.id = makeId("trn"); updateTrainings([record, ...trainings]); }
    setModalData(null);
  };
  const remove = (id) => { updateTrainings(trainings.filter((t) => t.id !== id)); setDeleting(null); };

  const countryParticipants = (country) => participants.filter((p) => !country || p.country === country);
  const countryTrainers = (country) => trainers.filter((t) => !country || t.country === country);

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div className="flex flex-wrap gap-2 flex-1 min-w-0">
          <div className="relative">
            <span className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: BRAND.sub }}><Icon name="search" size={15} /></span>
            <input className={inputCls} style={{ ...inputStyle, paddingLeft: 32, width: 200 }} placeholder="Search trainings\u2026" value={query} onChange={(e) => setQuery(e.target.value)} />
          </div>
          <select className={`${inputCls} w-auto`} style={inputStyle} value={fCountry} onChange={(e) => setFCountry(e.target.value)}>
            <option value="All">All countries</option>{countries.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
          <select className={`${inputCls} w-auto`} style={inputStyle} value={fCurriculum} onChange={(e) => setFCurriculum(e.target.value)}>
            <option value="All">All curriculums</option>{ALL_CURRICULUMS.map((t) => <option key={t.name} value={t.name}>{t.name}</option>)}
          </select>
        </div>
        <PrimaryButton onClick={openNew}><Icon name="plus" size={16} /> New training</PrimaryButton>
      </div>

      {filtered.length === 0 ? (
        <EmptyState iconName="calendar"
          title={trainings.length === 0 ? "No trainings recorded" : "No matches"}
          subtitle={trainings.length === 0 ? "Log your first training to get started." : "Try a different search or filter."}
          action={trainings.length === 0 && <PrimaryButton onClick={openNew}><Icon name="plus" size={16} /> New training</PrimaryButton>} />
      ) : (
        <div className="flex flex-col gap-2">
          {filtered.map((t) => {
            const cm = curriculumMeta(t.curriculum); const lm = levelMeta(t.trainingType); const sm = statusMeta(t.status);
            return (
              <div key={t.id} className="rounded-xl p-4 flex flex-wrap items-center gap-3" style={{ background: BRAND.card, border: `1px solid ${BRAND.border}` }}>
                <div className="flex-1 min-w-[180px] cursor-pointer" onClick={() => setViewing(t)}>
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <p className="text-sm font-semibold" style={{ color: BRAND.ink }}>{t.title}</p>
                    {t.trainingType && <Badge label={t.trainingType} color={lm.color} soft={lm.soft} />}
                    {t.curriculum && <Badge label={t.curriculum} color={cm.color} soft={cm.soft} />}
                    <Badge label={t.status} color={sm.color} soft={sm.soft} />
                    {(t.reportLink || t.reportSummary) && <span className="inline-flex items-center gap-1 text-xs" style={{ color: BRAND.tealDark }}><Icon name="file-text" size={12} /> Report added</span>}
                  </div>
                  <p className="text-xs flex items-center gap-3 flex-wrap" style={{ color: BRAND.sub }}>
                    <span className="flex items-center gap-1"><Icon name="map-pin" size={12} /> {t.country}{t.venue ? ` \u00b7 ${t.venue}` : ""}</span>
                    <span className="flex items-center gap-1"><Icon name="clock" size={12} /> {fmtDate(t.startDate)}{t.endDate ? ` \u2013 ${fmtDate(t.endDate)}` : ""}</span>
                    <span className="flex items-center gap-1"><Icon name="users" size={12} /> {(t.participantIds || []).length} participants</span>
                  </p>
                </div>
                <div className="flex gap-2 ml-auto">
                  <IconButton title="Edit" onClick={() => openEdit(t)}><Icon name="pencil" size={14} /></IconButton>
                  <IconButton title="Delete" danger onClick={() => setDeleting(t)}><Icon name="trash" size={14} /></IconButton>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {modalData && (
        <TrainingModal data={modalData} onClose={() => setModalData(null)} onSave={save} countries={countries} ensureCountry={ensureCountry}
          trainers={countryTrainers(modalData.country)} allParticipants={countryParticipants(modalData.country)} />
      )}
      {viewing && (
        <Modal title={viewing.title} onClose={() => setViewing(null)}>
          <TrainingDetail training={viewing} trainerById={trainerById} participantById={participantById} />
        </Modal>
      )}

  const [modalData, setModalData] = useState(null);

  const [query, setQuery] = useState("");
  const [importing, setImporting] = useState(false);

  const filtered = trainers.filter((t) => !query || t.name.toLowerCase().includes(query.toLowerCase()));

    if (!form.name.trim()) return;
    if (form.id) updateTrainers(trainers.map((t) => (t.id === form.id ? form : t)));
    else updateTrainers([{ ...form, id: makeId("trr") }, ...trainers]);
    setModalData(null);

      ) : (
        <div className="grid sm:grid-cols-2 gap-3">
          {filtered.map((t) => (
            <div key={t.id} className="rounded-xl p-4" style={{ background: BRAND.card, border: `1px solid ${BRAND.border}` }}>

function TrainerImportForm({ onImport, onCancel }) {
  const [step, setStep] = useState("upload");
  const [headers, setHeaders] = useState([]);
  const [dataRows, setDataRows] = useState([]);
  const [mapping, setMapping] = useState({ name: -1, email: -1, phone: -1, country: -1, city: -1, certTier: -1, specialization: -1, status: -1 });
  const [fileName, setFileName] = useState("");
  const fileRef = useRef(null);

  const handleFile = (file) => {
    if (!file) return;
    setFileName(file.name);
    const reader = new FileReader();
    reader.onload = (e) => {
      const rows = parseCsv(String(e.target.result || ""));
      if (rows.length === 0) return;
      const hdrs = rows[0]; const body = rows.slice(1);
      setHeaders(hdrs); setDataRows(body);
      setMapping({
        name: guessColumn(hdrs, ["name", "fullname", "trainername"]),
        email: guessColumn(hdrs, ["email", "emailaddress"]),
        phone: guessColumn(hdrs, ["phone", "phonenumber", "mobile", "contact"]),
        country: guessColumn(hdrs, ["country", "countrypartner"]),
        city: guessColumn(hdrs, ["city", "town", "location"]),
        certTier: guessColumn(hdrs, ["certificationtier", "certification", "tier"]),
        specialization: guessColumn(hdrs, ["specialization", "programspecialization", "curriculum"]),
        status: guessColumn(hdrs, ["status", "activeinactive"]),
      });
      setStep("map");
    };
    reader.readAsText(file);
  };

  const doImport = () => {
    if (mapping.name === -1) return;
    const rows = dataRows.map((r) => ({
      name: (r[mapping.name] || "").trim(),
      email: mapping.email !== -1 ? (r[mapping.email] || "").trim() : "",
      phone: mapping.phone !== -1 ? (r[mapping.phone] || "").trim() : "",
      country: mapping.country !== -1 ? (r[mapping.country] || "").trim() : "",
      city: mapping.city !== -1 ? (r[mapping.city] || "").trim() : "",
      certTier: mapping.certTier !== -1 ? (r[mapping.certTier] || "").trim() : "",
      specialization: mapping.specialization !== -1 ? (r[mapping.specialization] || "").trim() : "",
      status: mapping.status !== -1 ? (r[mapping.status] || "").trim() || "Active" : "Active",
    })).filter((r) => r.name);
    onImport(rows);
  };

  if (step === "upload") {
    return (
      <div>
        <p className="text-sm mb-4" style={{ color: BRAND.sub }}>
          Export your trainer list as a CSV (in Google Sheets: File &rarr; Download &rarr; Comma Separated Values) and upload it here.
          You'll be able to match your columns to the right fields before anything is imported.
        </p>
        <div className="rounded-xl border-2 border-dashed flex flex-col items-center justify-center py-10 px-4 text-center cursor-pointer" style={{ borderColor: BRAND.border }}
          onClick={() => fileRef.current?.click()}
          onDrop={(e) => { e.preventDefault(); handleFile(e.dataTransfer.files?.[0]); }} onDragOver={(e) => e.preventDefault()}>
          <Icon name="upload" size={22} style={{ color: BRAND.tealDark }} className="mb-2" />
          <p className="text-sm font-medium" style={{ color: BRAND.ink }}>Click to choose a CSV file, or drag it here</p>
          <p className="text-xs mt-1" style={{ color: BRAND.sub }}>.csv only</p>
          <input ref={fileRef} type="file" accept=".csv,text/csv" className="hidden" onChange={(e) => handleFile(e.target.files?.[0])} />
        </div>
        <div className="flex justify-end gap-2 mt-4"><SecondaryButton onClick={onCancel}>Cancel</SecondaryButton></div>
      </div>
    );
  }

  if (step === "map") {
    const fields = [
      { key: "name", label: "Name", required: true }, { key: "email", label: "Email" }, { key: "phone", label: "Phone" },
      { key: "country", label: "Country" }, { key: "city", label: "City" }, { key: "certTier", label: "Certification tier" },
      { key: "specialization", label: "Specialization" }, { key: "status", label: "Status" },
    ];
    return (
      <div>
        <p className="text-sm mb-1" style={{ color: BRAND.ink }}>{fileName} &middot; {dataRows.length} rows found</p>
        <p className="text-xs mb-4" style={{ color: BRAND.sub }}>Match each field to a column from your file.</p>
        <div className="grid sm:grid-cols-2 gap-x-4">
          {fields.map((f) => (
            <Field key={f.key} label={f.label} required={f.required}>
              <select className={inputCls} style={inputStyle} value={mapping[f.key]} onChange={(e) => setMapping((m) => ({ ...m, [f.key]: Number(e.target.value) }))}>
                <option value={-1}>{"\u2014 Don't import \u2014"}</option>
                {headers.map((h, i) => <option key={i} value={i}>{h || `Column ${i + 1}`}</option>)}
              </select>
            </Field>
          ))}
        </div>
        {dataRows.length > 0 && (
          <div className="rounded-lg overflow-x-auto mb-3" style={{ border: `1px solid ${BRAND.border}` }}>
            <table className="w-full text-xs">
              <thead><tr style={{ background: BRAND.bg }}>{fields.map((f) => <th key={f.key} className="text-left px-2 py-1.5 font-medium" style={{ color: BRAND.sub }}>{f.label}</th>)}</tr></thead>
              <tbody>{dataRows.slice(0, 3).map((r, i) => (<tr key={i}>{fields.map((f) => <td key={f.key} className="px-2 py-1.5" style={{ color: BRAND.ink }}>{mapping[f.key] !== -1 ? r[mapping[f.key]] : "\u2014"}</td>)}</tr>))}</tbody>
            </table>
          </div>
        )}
        <div className="flex justify-between gap-2 mt-2">
          <SecondaryButton onClick={() => setStep("upload")}>Back</SecondaryButton>
          <div className="flex gap-2">
            <SecondaryButton onClick={onCancel}>Cancel</SecondaryButton>
            <PrimaryButton onClick={doImport}><Icon name="arrow-right" size={15} /> Import {dataRows.filter((r) => mapping.name !== -1 && (r[mapping.name] || "").trim()).length} trainers</PrimaryButton>
          </div>
        </div>
      </div>
    );
  }
  return null;
}

/* ---------------------------------------------------------------------- */
/* Participants                                                           */
/* ---------------------------------------------------------------------- */

function emptyParticipant() { return { id: null, name: "", gender: "", age: "", country: "", contact: "", group: "" }; }

function ParticipantsView({ participants, updateParticipants, trainings, countries, ensureCountry }) {
  const [modalData, setModalData] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const [query, setQuery] = useState("");
  const [fCountry, setFCountry] = useState("All");

  const trainingsFor = (id) => trainings.filter((t) => (t.participantIds || []).includes(id));
  const filtered = participants.filter((p) => fCountry === "All" || p.country === fCountry).filter((p) => !query || p.name.toLowerCase().includes(query.toLowerCase()));

  const save = (form) => {
    if (!form.name.trim()) return;
    if (form.id) updateParticipants(participants.map((p) => (p.id === form.id ? form : p)));
    else updateParticipants([{ ...form, id: makeId("ptc") }, ...participants]);
    setModalData(null);
  };
  const remove = (id) => { updateParticipants(participants.filter((p) => p.id !== id)); setDeleting(null); };

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div className="flex flex-wrap gap-2">
          <div className="relative">
            <span className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: BRAND.sub }}><Icon name="search" size={15} /></span>
            <input className={inputCls} style={{ ...inputStyle, paddingLeft: 32, width: 200 }} placeholder="Search participants\u2026" value={query} onChange={(e) => setQuery(e.target.value)} />
          </div>
          <select className={`${inputCls} w-auto`} style={inputStyle} value={fCountry} onChange={(e) => setFCountry(e.target.value)}>
            <option value="All">All countries</option>{countries.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <PrimaryButton onClick={() => setModalData(emptyParticipant())}><Icon name="plus" size={16} /> New participant</PrimaryButton>
      </div>

      {filtered.length === 0 ? (
        <EmptyState iconName="users" title="No participants yet" subtitle="Add participants so you can link them to trainings."
          action={<PrimaryButton onClick={() => setModalData(emptyParticipant())}><Icon name="plus" size={16} /> New participant</PrimaryButton>} />
      ) : (
        <div className="rounded-xl overflow-hidden" style={{ border: `1px solid ${BRAND.border}` }}>
          <table className="w-full text-sm" style={{ tableLayout: "fixed" }}>
            <thead>
              <tr style={{ background: BRAND.bg, color: BRAND.sub }}>
                <th className="text-left font-medium px-3 py-2.5">Name</th>
                <th className="text-left font-medium px-3 py-2.5 hidden sm:table-cell">Gender</th>
                <th className="text-left font-medium px-3 py-2.5 hidden sm:table-cell">Country</th>
                <th className="text-left font-medium px-3 py-2.5 hidden md:table-cell">Trainings</th>
                <th className="text-right font-medium px-3 py-2.5 w-20">Actions</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((p, i) => (
                <tr key={p.id} style={{ background: i % 2 ? BRAND.bg : "white" }}>
                  <td className="px-3 py-2.5 truncate" style={{ color: BRAND.ink }}>{p.name}</td>
                  <td className="px-3 py-2.5 hidden sm:table-cell" style={{ color: BRAND.sub }}>{p.gender || "\u2014"}</td>
                  <td className="px-3 py-2.5 hidden sm:table-cell" style={{ color: BRAND.sub }}>{p.country || "\u2014"}</td>
                  <td className="px-3 py-2.5 hidden md:table-cell" style={{ color: BRAND.sub }}>{trainingsFor(p.id).length}</td>
                  <td className="px-3 py-2.5 text-right">
                    <div className="flex gap-1.5 justify-end">
                      <IconButton title="Edit" onClick={() => setModalData(p)}><Icon name="pencil" size={13} /></IconButton>
                      <IconButton title="Delete" danger onClick={() => setDeleting(p)}><Icon name="trash" size={13} /></IconButton>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {modalData && <Modal title={modalData.id ? "Edit participant" : "New participant"} onClose={() => setModalData(null)}><ParticipantForm data={modalData} countries={countries} ensureCountry={ensureCountry} onSave={save} onCancel={() => setModalData(null)} /></Modal>}
      {deleting && <ConfirmDialog text={`Delete "${deleting.name}"? They'll also be removed from any training rosters.`} onConfirm={() => remove(deleting.id)} onCancel={() => setDeleting(null)} />}
    </div>
  );
}

function ParticipantForm({ data, countries, ensureCountry, onSave, onCancel }) {
  const [form, setForm] = useState(data);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  return (
    <div>
      <Field label="Full name" required><input className={inputCls} style={inputStyle} value={form.name} onChange={(e) => set("name", e.target.value)} placeholder="e.g. John Mwangi" /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Gender">
          <select className={inputCls} style={inputStyle} value={form.gender} onChange={(e) => set("gender", e.target.value)}>
            <option value="">Select\u2026</option>{GENDERS.map((g) => <option key={g} value={g}>{g}</option>)}
          </select>
        </Field>
        <Field label="Age"><input type="number" min="0" className={inputCls} style={inputStyle} value={form.age} onChange={(e) => set("age", e.target.value)} /></Field>
      </div>
      <Field label="Country"><CountrySelect value={form.country} onChange={(v) => set("country", v)} countries={countries} ensureCountry={ensureCountry} /></Field>
      <Field label="School / group (optional)"><input className={inputCls} style={inputStyle} value={form.group} onChange={(e) => set("group", e.target.value)} placeholder="e.g. Riverside Secondary" /></Field>
      <Field label="Contact (optional)"><input className={inputCls} style={inputStyle} value={form.contact} onChange={(e) => set("contact", e.target.value)} placeholder="Phone or guardian contact" /></Field>
      <div className="flex justify-end gap-2 mt-2">
        <SecondaryButton onClick={onCancel}>Cancel</SecondaryButton>
        <PrimaryButton onClick={() => onSave(form)}>Save participant</PrimaryButton>
      </div>
    </div>
  );
}

    if (typeof React === "undefined") missing.push("React (unpkg.com)");

    if (typeof Babel === "undefined") missing.push("Babel (unpkg.com)");
    if (typeof Chart === "undefined") missing.push("Chart.js (cdnjs.cloudflare.com)");
    if (typeof firebase === "undefined") missing.push("Firebase (gstatic.com)");
    if (missing.length) {
      var box = document.getElementById("tms-fatal-error");
      var detail = document.getElementById("tms-fatal-error-detail");
      if (box) box.style.display = "block";
      if (detail) detail.textContent += "These scripts did not load: " + missing.join(", ") + ". Check whether your network blocks any of these domains.\n";
      return;
    }
    var source = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
    var scriptEl = document.createElement("script");
    scriptEl.textContent = compiled;
    document.body.appendChild(scriptEl);
  })();
